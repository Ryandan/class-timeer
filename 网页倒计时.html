<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悬浮倒计时 - 课堂完美版</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #ffffff;
            --text-color: #1d1d1f;
            --alert-color: #ff3b30;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
            background-color: var(--bg-color);
            font-family: -apple-system, "SF Pro", "Helvetica Neue", Arial, sans-serif;
        }

        #timer-app {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            padding: 10px;
            position: relative;
        }

        /* 主窗口字体调整 */
        .display {
            font-size: clamp(80px, 25vw, 60vh); 
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 2vh;
            text-shadow: 0 4px 20px rgba(0,0,0,0.08);
            user-select: none; 
            transition: color 0.3s ease;
        }

        .time-up-animation {
            color: var(--alert-color) !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }

        .controls-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            background: #f2f2f7;
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover {
            background: #e5e5ea;
            transform: scale(1.05);
        }

        button.primary {
            background: var(--primary-color);
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
        }

        button.primary:hover {
            background: #0063cc;
        }

        button.action-btn {
            background: #34c759;
            color: white;
        }
        
        button.action-btn:hover {
            background: #28a745;
        }

        .custom-input {
            display: flex;
            gap: 8px;
            margin-top: 5px;
            align-items: center;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
        }

        input[type="number"] {
            width: 80px;
            padding: 10px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
            outline: none;
        }

        .pip-controls {
            display: none;
            gap: 15px;
            margin-top: 15px;
            justify-content: center;
        }

        .pip-controls button {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        
        .pip-controls button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .pip-body .controls-container { display: none; }
        .pip-body .pip-controls { display: flex; }
        .pip-body #timer-app { background: #000; padding: 20px; }
        
        /* 核心修复：精准计算的悬浮窗动态缩放比，33vw完美兼容5个字符，65vh留出底部按钮空间 */
        .pip-body .display {
            font-size: clamp(40px, 33vw, 65vh); 
            color: #fff;
            margin: 0;
            text-shadow: none;
        }
        .pip-body .time-up-animation {
            color: var(--alert-color) !important;
        }
    </style>
</head>
<body>

<div id="timer-app">
    <div class="display" id="time-display">01:00</div>
    
    <div class="controls-container">
        <div class="btn-group" id="preset-container">
            <button class="preset-btn" data-time="60">1分钟</button>
            <button class="preset-btn" data-time="120">2分钟</button>
            <button class="preset-btn" data-time="180">3分钟</button>
            <button class="preset-btn" data-time="300">5分钟</button>
            <button class="preset-btn" data-time="600">10分钟</button>
            <button class="preset-btn" data-time="1200">20分钟</button>
        </div>
        
        <div class="custom-input">
            <input type="number" id="custom-min" placeholder="分钟" min="1">
            <button id="set-custom-btn">仅使用一次</button>
            <button class="action-btn" id="add-preset-btn">➕ 设为快捷键</button>
        </div>

        <div class="btn-group">
            <button class="primary" id="start-btn">开始计时</button>
            <button id="reset-btn">重置</button>
            <button id="fullscreen-btn">网页全屏</button> 
        </div>
        
        <button class="action-btn" id="pip-trigger" style="background:#ff9500;">开启桌面悬浮窗</button>
    </div>

    <div class="pip-controls">
        <button id="pip-start-btn">暂停</button>
        <button id="pip-reset-btn">重置</button>
        <button id="pip-close-btn">退出悬浮</button> 
    </div>
</div>

<script>
    let timeLeft = 60;
    let initialTime = 60;
    let timerId = null;
    let isPaused = true;
    const display = document.getElementById('time-display');
    const startBtn = document.getElementById('start-btn');
    const pipStartBtn = document.getElementById('pip-start-btn');
    const presetContainer = document.getElementById('preset-container');
    
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq, duration, vol = 0.3) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = 'sine'; 
        osc.frequency.value = freq;
        
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const secs = (timeLeft % 60).toString().padStart(2, '0');
        display.textContent = `${mins}:${secs}`;
    }

    function clearAlertState() {
        display.classList.remove('time-up-animation');
    }

    function setTime(seconds) {
        stopTimer();
        clearAlertState();
        initialTime = seconds;
        timeLeft = seconds;
        updateDisplay();
    }

    function setCustomTime() {
        const val = document.getElementById('custom-min').value;
        if (val > 0) setTime(parseInt(val) * 60);
    }

    function addCustomPreset() {
        const val = document.getElementById('custom-min').value;
        if (val > 0) {
            const newBtn = document.createElement('button');
            newBtn.className = 'preset-btn';
            newBtn.setAttribute('data-time', val * 60);
            newBtn.textContent = val + '分钟';
            
            newBtn.addEventListener('click', (e) => {
                setTime(parseInt(e.target.getAttribute('data-time')));
            });
            
            presetContainer.appendChild(newBtn);
            setTime(parseInt(val) * 60);
            document.getElementById('custom-min').value = ''; 
        } else {
            alert("请先输入有效的分钟数");
        }
    }

    function toggleTimer() {
        if (isPaused) startTimer();
        else pauseTimer();
    }

    function syncButtons(text, color, pipColor) {
        startBtn.textContent = text;
        startBtn.style.background = color;
        pipStartBtn.textContent = text;
        pipStartBtn.style.background = pipColor;
    }

    function startTimer() {
        if (!isPaused) return;
        
        if (timeLeft <= 0) {
            timeLeft = initialTime; 
            clearAlertState();
        }
        
        isPaused = false;
        syncButtons("暂停", "#ff9500", "rgba(255, 149, 0, 0.4)");
        
        timerId = setInterval(() => {
            timeLeft--;
            updateDisplay();

            if (timeLeft <= 5 && timeLeft > 0) {
                playBeep(600, 0.15, 0.8); 
            }
            
            if (timeLeft <= 0) {
                clearInterval(timerId);
                
                playBeep(800, 0.4, 1.0); 
                setTimeout(() => { playBeep(600, 0.8, 1.0); }, 300); 
                
                display.classList.add('time-up-animation');
                stopTimer();
            }
        }, 1000);
    }

    function pauseTimer() {
        isPaused = true;
        syncButtons("继续", "#007AFF", "rgba(0, 122, 255, 0.5)");
        clearInterval(timerId);
    }

    function stopTimer() {
        isPaused = true; 
        clearInterval(timerId);
        syncButtons("开始计时", "#007AFF", "rgba(255, 255, 255, 0.15)");
        pipStartBtn.textContent = "开始";
    }

    function resetTimer() {
        stopTimer();
        clearAlertState(); 
        timeLeft = initialTime; 
        updateDisplay();
    }

    // --- 事件绑定 ---
    document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            setTime(parseInt(e.target.getAttribute('data-time')));
        });
    });

    document.getElementById('set-custom-btn').addEventListener('click', setCustomTime);
    document.getElementById('add-preset-btn').addEventListener('click', addCustomPreset); 
    
    startBtn.addEventListener('click', toggleTimer);
    document.getElementById('reset-btn').addEventListener('click', resetTimer);
    pipStartBtn.addEventListener('click', toggleTimer);
    document.getElementById('pip-reset-btn').addEventListener('click', resetTimer);

    const fullscreenBtn = document.getElementById('fullscreen-btn');
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`全屏失败: ${err.message}`);
            });
            fullscreenBtn.textContent = "退出全屏";
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
                fullscreenBtn.textContent = "网页全屏";
            }
        }
    });

    document.getElementById('pip-close-btn').addEventListener('click', () => {
        if ('documentPictureInPicture' in window && window.documentPictureInPicture.window) {
            window.documentPictureInPicture.window.close();
        }
    });

    const pipBtn = document.getElementById('pip-trigger');
    if ('documentPictureInPicture' in window) {
        pipBtn.addEventListener('click', async () => {
            const pipWindow = await window.documentPictureInPicture.requestWindow({
                width: 450,
                height: 300,
            });

            const timerApp = document.getElementById('timer-app');
            pipWindow.document.body.append(timerApp);
            pipWindow.document.body.classList.add('pip-body');

            [...document.styleSheets].forEach((styleSheet) => {
                try {
                    const cssRules = [...styleSheet.cssRules].map((rule) => rule.cssText).join('');
                    const style = document.createElement('style');
                    style.textContent = cssRules;
                    pipWindow.document.head.append(style);
                } catch (e) {}
            });

            pipWindow.addEventListener("pagehide", (event) => {
                document.body.append(timerApp);
                document.body.classList.remove('pip-body');
            });
        });
    } else {
        pipBtn.textContent = "浏览器版本过低，不支持置顶";
        pipBtn.disabled = true;
    }
    
    stopTimer();
</script>

</body>
</html>
